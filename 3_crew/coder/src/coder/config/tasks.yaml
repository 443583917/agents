coding_task:
  description: >
    Write python code to achieve this: {assignment}
  expected_output: >
    A text file that includes the code itself, along with the output of the code.
  agent: coder
  output_file: output/code_and_output.txt

# ============================================================
# tasks.yaml — Task 配置模板
# 所有可用的参数及说明
  # ── 绑定与依赖 ────────────────────────────────────
  # agent: coder                        # 绑定执行此任务的 Agent（对应 agents.yaml 的 key）
  # context:                            # 前置任务列表，其输出会作为本任务的输入
  #   - coding_task                     #   引用其他 @task 方法名
  #   - review_task

  # ── 输出控制 ──────────────────────────────────────
  # output_file: output/result.txt      # 输出写入文件
  # output_json:                        # JSON 格式输出 Schema
  #   type: object
  #   properties:
  #     code:
  #       type: string
  #     output:
  #       type: string

  # ── 执行控制 ──────────────────────────────────────
  # async_execution: false              # 是否异步执行（不等待结果）
  # human_input: false                  # 执行前是否需要人类确认
  # tools: []                           # 本 Task 专属工具（通常用 Agent 级别的工具）
  # config: {}                          # 额外配置项
