# ============================================================
# pyproject.toml — 项目配置文件
# 定义项目的元数据、依赖、CLI 入口脚本和构建系统
# ============================================================

[project]
# ── 项目元数据 ──────────────────────────────────────
name = "demo_crew"
version = "0.1.0"
description = "demo_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]

# ── Python 版本约束 ─────────────────────────────────
# >=3.10: 需要 match-case 等新语法特性
# <3.14: 避免 Python 3.14 的兼容性问题（CrewAI 尚未适配）
requires-python = ">=3.10,<3.14"

# ── 项目依赖 ────────────────────────────────────────
# crewai[tools]: CrewAI 核心 + 工具扩展包（含文件读写、搜索等内置工具）
dependencies = [
    "crewai[tools]>=0.130.0,<1.0.0"
]

# ============================================================
# CLI 入口脚本
# 格式：命令名 = "模块路径:函数名"
# 安装后可直接在终端输入这些命令来运行
# ============================================================
[project.scripts]
demo_crew = "demo_crew.main:run"       # crewai run 的默认入口
run_crew = "demo_crew.main:run"        # 等价别名
train = "demo_crew.main:train"         # crewai train  → 训练模式
replay = "demo_crew.main:replay"       # crewai replay → 回放模式
test = "demo_crew.main:test"           # crewai test   → 测试模式

# ============================================================
# 构建系统配置
# hatchling: 轻量级 Python 构建后端
# ============================================================
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ============================================================
# CrewAI 工具配置
# type = "crew": 标记这是一个 Crew 项目，CLI 可自动发现
# ============================================================
[tool.crewai]
type = "crew"
